# configure the semantic-release utility
tagFormat: ${version}
debug: true
plugins:
  - "@semantic-release/commit-analyzer"
  - "@semantic-release/release-notes-generator"
  - [
    "@semantic-release/github",
    {
      "draftRelease": true
    }
  ]
  - [
      "@semantic-release/exec",
      {
        "verifyReleaseCmd": "echo \"tag=${nextRelease.version}\" >> $GITHUB_OUTPUT && gh release delete \"${nextRelease.version}\" -y || true"
      }
    ]
branches:
  - name: 'main'
