configurations.all {
  exclude group: 'org.slf4j', module: 'slf4j-log4j12'
  exclude group: 'log4j', module: 'log4j'
}

dependencies {

  api project(':sda-commons-server-testing')

  api "org.apache.kafka:kafka-clients"

  implementation "org.apache.kafka:kafka-test-common-runtime"

  implementation "org.apache.kafka:kafka-clients:4.4.0:test-fixtures"

  implementation 'org.bouncycastle:bcpkix-jdk18on'

  api 'commons-io:commons-io'
  api 'org.awaitility:awaitility'
  api 'org.apache.commons:commons-lang3'
  api 'org.slf4j:slf4j-api'

  testImplementation project(':sda-commons-server-dropwizard')
}